services:
  postgres:
    image: postgres:16-alpine
    container_name: tecnicos_db
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "1235"
      POSTGRES_DB: tecnicos

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tecnicos"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - tecnicos_network


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: tecnicos_backend
    restart: unless-stopped

    environment:
      NODE_ENV: production

      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: "1235"
      DB_NAME: tecnicos

      PORT: "3001"

      JWT_SECRET: una_clave_super_secreta
      JWT_EXPIRES: 7d

      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: llama3.2:3b

      N8N_URL: http://n8n:5678

      CORS_ORIGIN: https://tecnicos.tecnonacho.com

    ports:
      - "3001:3001"

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - tecnicos_network


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: https://tecnicos.tecnonacho.com

    container_name: tecnicos_frontend
    restart: unless-stopped

    ports:
      - "8082:80"

    depends_on:
      - backend

    networks:
      - tecnicos_network


  ollama:
    image: ollama/ollama:latest
    container_name: tecnicos_ollama
    restart: unless-stopped

    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: 24h

    ports:
      - "11435:11434"

    volumes:
      - ollama_data:/root/.ollama

    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

    networks:
      - tecnicos_network


  n8n:
    image: n8nio/n8n:latest
    container_name: tecnicos_n8n
    restart: unless-stopped

    environment:
      # Puerto HTTP interno de n8n
      N8N_LISTEN_ADDRESS: 0.0.0.0
      N8N_PORT: "5678"
      N8N_PROTOCOL: http

      # Se usa 5680 para evitar el conflicto observado con el puerto 5679
      N8N_RUNNERS_BROKER_PORT: "5680"

      # Zona horaria
      TZ: America/Bogota
      GENERIC_TIMEZONE: America/Bogota

      # Configuración de PostgreSQL
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: tecnicos
      DB_POSTGRESDB_USER: postgres
      DB_POSTGRESDB_PASSWORD: "1235"

      # Configuración general
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"

    ports:
      - "5679:5678"

    depends_on:
      postgres:
        condition: service_healthy

    volumes:
      - n8n_data:/home/node/.n8n

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:5678/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    networks:
      - tecnicos_network


volumes:
  postgres_data:
  ollama_data:
  n8n_data:


networks:
  tecnicos_network:
    driver: bridge
