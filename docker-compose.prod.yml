services:
  postgres:
    image: postgres:16-alpine
    container_name: tecnicos_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1235
      POSTGRES_DB: tecnicos
    ports:
      - "5433:5432"  # Cambiado para evitar conflicto
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tecnicos_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tecnicos_backend
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: 1235
      DB_NAME: tecnicos
      PORT: 3001
      JWT_SECRET: una_clave_super_secreta
      JWT_EXPIRES: 7d
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: llama3.2:3b
      CORS_ORIGIN: https://tecnicos.tecnonacho.com
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - tecnicos_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod  # Necesitaremos crear este archivo
    container_name: tecnicos_frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: https://tecnicos.tecnonacho.com/api
    ports:
      - "8082:80"  # Frontend en puerto 8080
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - tecnicos_network

  ollama:
    image: ollama/ollama:latest
    container_name: tecnicos_ollama
    restart: unless-stopped
    ports:
      - "11435:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_KEEP_ALIVE=24h
    networks:
      - tecnicos_network

  n8n:
    image: n8nio/n8n:latest
    container_name: tecnicos_n8n
    restart: unless-stopped
    environment:
      - N8N_BASIC_AUTH_ACTIVE=false
      - N8N_HOST=tecnicos.tecnonacho.com
      - N8N_PORT=5679
      - N8N_PROTOCOL=https
      - WEBHOOK_URL=https://tecnicos.tecnonacho.com:5679/
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=tecnicos
      - DB_POSTGRESDB_USER=postgres
      - DB_POSTGRESDB_PASSWORD=1235
    ports:
      - "5679:5678"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - tecnicos_network

volumes:
  postgres_data:
  ollama_data:
  n8n_data:

networks:
  tecnicos_network:
    driver: bridge
