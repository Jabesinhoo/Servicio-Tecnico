name: Deploy Sistema Técnicos VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-tecnicos-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar SSH
        shell: bash
        env:
          VPS_SSH_KEY_B64: ${{ secrets.VPS_SSH_KEY_B64 }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -e
          mkdir -p ~/.ssh

          printf '%s' "$VPS_SSH_KEY_B64" | base64 -d > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null

          HOST_CLEAN="$(printf '%s' "$VPS_HOST" | tr -d '\r\n' | xargs)"
          PORT_CLEAN="$(printf '%s' "$VPS_PORT" | tr -d '\r\n' | xargs)"

          ssh-keyscan -p "$PORT_CLEAN" -H "$HOST_CLEAN" >> ~/.ssh/known_hosts

      - name: Deploy en VPS
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -e

          HOST_CLEAN="$(printf '%s' "$VPS_HOST" | tr -d '\r\n' | xargs)"
          USER_CLEAN="$(printf '%s' "$VPS_USER" | tr -d '\r\n' | xargs)"
          PORT_CLEAN="$(printf '%s' "$VPS_PORT" | tr -d '\r\n' | xargs)"

          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes -p "$PORT_CLEAN" "$USER_CLEAN@$HOST_CLEAN" << 'DEPLOY_SCRIPT'
            set -e

            echo "========================================="
            echo "🚀 INICIANDO DEPLOY - SISTEMA TÉCNICOS"
            echo "========================================="

            echo ""
            echo "🧹 Limpiando contenedores huérfanos..."
            docker container prune -f || true
            docker volume prune -f || true

            echo ""
            echo "🔄 Actualizando repositorio..."
            cd /opt/tecnicos/Servicio-Tecnico
            git fetch origin
            git reset --hard origin/main

            echo ""
            echo "🛑 Deteniendo contenedores existentes..."
            docker compose -f docker-compose.prod.yml down --remove-orphans || true

            echo ""
            echo "🔨 Reconstruyendo y levantando contenedores..."
            docker compose -f docker-compose.prod.yml up -d --build

            echo ""
            echo "📊 Verificando estado de los contenedores..."
            docker compose -f docker-compose.prod.yml ps

            echo ""
            echo "🧹 Limpiando imágenes viejas..."
            docker image prune -f || true

            echo ""
            echo "🌐 Probando el backend..."
            curl -s http://localhost:3001/api/health || echo "⚠️ Backend no responde"

            echo ""
            echo "========================================="
            echo "✅ DEPLOY COMPLETADO CON ÉXITO"
            echo "🌐 https://tecnicos.tecnonacho.com"
            echo "========================================="
