name: Deploy Sistema Técnicos VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-tecnicos-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar SSH
        shell: bash
        env:
          VPS_SSH_KEY_B64: ${{ secrets.VPS_SSH_KEY_B64 }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh

          printf '%s' "$VPS_SSH_KEY_B64" | base64 -d > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null

          HOST_CLEAN="$(printf '%s' "$VPS_HOST" | tr -d '\r\n' | xargs)"
          PORT_CLEAN="$(printf '%s' "$VPS_PORT" | tr -d '\r\n' | xargs)"

          ssh-keyscan -p "$PORT_CLEAN" -H "$HOST_CLEAN" >> ~/.ssh/known_hosts

      - name: Deploy en VPS
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail

          HOST_CLEAN="$(printf '%s' "$VPS_HOST" | tr -d '\r\n' | xargs)"
          USER_CLEAN="$(printf '%s' "$VPS_USER" | tr -d '\r\n' | xargs)"
          PORT_CLEAN="$(printf '%s' "$VPS_PORT" | tr -d '\r\n' | xargs)"

          ssh \
            -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=yes \
            -p "$PORT_CLEAN" \
            "$USER_CLEAN@$HOST_CLEAN" \
            'bash -se' << 'DEPLOY_SCRIPT'

          set -euo pipefail

          PROJECT_DIR="/opt/tecnicos/Servicio-Tecnico"
          COMPOSE_FILE="docker-compose.prod.yml"

          echo "========================================="
          echo "INICIANDO DEPLOY - SISTEMA TÉCNICOS"
          echo "========================================="

          cd "$PROJECT_DIR"

          echo ""
          echo "Actualizando repositorio..."
          git fetch origin main
          git reset --hard origin/main

          echo ""
          echo "Commit desplegado:"
          git log -1 --oneline

          echo ""
          echo "Validando Docker Compose..."
          docker compose -f "$COMPOSE_FILE" config --quiet

          echo ""
          echo "Construyendo imágenes..."
          docker compose -f "$COMPOSE_FILE" build

          echo ""
          echo "Actualizando contenedores..."
          docker compose -f "$COMPOSE_FILE" up -d --remove-orphans

          echo ""
          echo "Estado inicial:"
          docker compose -f "$COMPOSE_FILE" ps

          # =====================================================
          # BACKEND
          # =====================================================

          echo ""
          echo "Esperando al backend..."

          BACKEND_OK=false

          for intento in $(seq 1 30); do

            if curl -fsS \
              http://127.0.0.1:3001/api/health \
              > /dev/null; then

              BACKEND_OK=true
              echo "Backend disponible."
              break
            fi

            echo "Intento $intento/30: backend aún no disponible."
            sleep 3
          done

          if [ "$BACKEND_OK" != "true" ]; then

            echo ""
            echo "ERROR: backend no respondió."

            docker compose -f "$COMPOSE_FILE" ps

            docker compose \
              -f "$COMPOSE_FILE" \
              logs backend \
              --tail=200

            exit 1
          fi

          # =====================================================
          # VERIFICAR POSTGRESQL DESDE BACKEND
          # =====================================================

          echo ""
          echo "Verificando conexión backend -> PostgreSQL..."

          docker compose \
            -f "$COMPOSE_FILE" \
            exec -T backend \
            node -e "
              const db = require('./src/models');

              db.sequelize.authenticate()
                .then(() => {
                  console.log('PostgreSQL OK');
                  process.exit(0);
                })
                .catch((error) => {
                  console.error(error);
                  process.exit(1);
                });
            "

          # =====================================================
          # SINCRONIZACIÓN DE PERMISOS
          # =====================================================

          echo ""
          echo "Sincronizando catálogo de permisos..."

          docker compose \
            -f "$COMPOSE_FILE" \
            exec -T backend \
            node -e "
              const {
                syncPermissionsToDatabase
              } = require('./src/services/permissionsRegistry');

              syncPermissionsToDatabase()
                .then((permissions) => {
                  console.log(
                    'Permisos disponibles:',
                    permissions.length
                  );
                  process.exit(0);
                })
                .catch((error) => {
                  console.error(
                    'Error sincronizando permisos:',
                    error
                  );
                  process.exit(1);
                });
            "

          # =====================================================
          # FRONTEND
          # =====================================================

          echo ""
          echo "Esperando al frontend..."

          FRONTEND_OK=false

          for intento in $(seq 1 30); do

            if curl -fsS \
              http://127.0.0.1:8082/ \
              > /dev/null; then

              FRONTEND_OK=true
              echo "Frontend disponible."
              break
            fi

            echo "Intento $intento/30: frontend aún no disponible."
            sleep 3
          done

          if [ "$FRONTEND_OK" != "true" ]; then

            echo ""
            echo "ERROR: frontend no respondió."

            docker compose -f "$COMPOSE_FILE" ps

            docker compose \
              -f "$COMPOSE_FILE" \
              logs frontend \
              --tail=200

            exit 1
          fi

          # =====================================================
          # VERIFICACIÓN FINAL
          # =====================================================

          echo ""
          echo "Logs recientes del backend:"

          docker compose \
            -f "$COMPOSE_FILE" \
            logs backend \
            --tail=80

          echo ""
          echo "Estado final:"

          docker compose \
            -f "$COMPOSE_FILE" \
            ps

          echo ""
          echo "========================================="
          echo "DEPLOY COMPLETADO CORRECTAMENTE"
          echo "https://tecnicos.tecnonacho.com"
          echo "========================================="

          DEPLOY_SCRIPT