name: Deploy Sistema Técnicos VPS
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-tecnicos-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout del commit
        uses: actions/checkout@v4
      - name: Preparar SSH verificado
        shell: bash
        env:
          VPS_SSH_KEY_B64: ${{ secrets.VPS_SSH_KEY_B64 }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          umask 077
          test -n "$VPS_SSH_KEY_B64"
          test -n "$VPS_KNOWN_HOSTS"
          mkdir -p ~/.ssh
          printf '%s' "$VPS_SSH_KEY_B64" | base64 --decode > ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Desplegar commit exacto
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          HOST="$(printf '%s' "$VPS_HOST" | tr -d '\r\n' | xargs)"
          USER="$(printf '%s' "$VPS_USER" | tr -d '\r\n' | xargs)"
          PORT="$(printf '%s' "${VPS_PORT:-22}" | tr -d '\r\n' | xargs)"
          [[ "$HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
          [[ "$USER" =~ ^[a-zA-Z0-9_-]+$ ]]
          [[ "$PORT" =~ ^[0-9]+$ ]]
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            -p "$PORT" "$USER@$HOST" "bash -se -- $DEPLOY_SHA" \
            < deploy/deploy-vps.sh
